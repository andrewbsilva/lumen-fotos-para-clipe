<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração — Lumen Fotos</title><link rel="stylesheet" href="/style.css"><main class="card wide"><header><h1>🎓 LUMEN FOTOS PARA CLIPE</h1><p>Painel administrativo</p></header><section id="login"><form id="loginForm"><label>E-mail<input name="email" type="email" required></label><label>Senha<input name="password" type="password" required></label><button>Entrar</button></form></section><section id="dashboard" hidden><p id="status"></p><p><a href="/oauth/start">🔗 Conectar meu Google Drive</a> (somente administrador)</p><h3>Cadastrar escola</h3><form id="add"><label>Nome<input name="name" required></label><label>Representante<select name="representative"><option>ANDREW</option><option>PAULO</option><option>IGOR</option><option>MOYA</option><option>BRUNINHO</option><option>RENATO</option></select></label><label>Ano<input name="year" type="number" value="2026" min="2026" max="2100"></label><button>Adicionar escola</button></form><h3>Escolas e links</h3><label>Filtrar representante<select id="filter"><option value="">Todos</option><option>ANDREW</option><option>PAULO</option><option>IGOR</option><option>MOYA</option><option>BRUNINHO</option><option>RENATO</option></select></label><div id="schools"></div><button id="logout">Sair</button></section><p id="msg" role="status"></p></main><script>let schools=[];const msg=document.querySelector('#msg');async function request(url,opts){const r=await fetch(url,opts);const j=await r.json();if(!r.ok)throw Error(j.error||'Erro');return j}async function load(){schools=await request('/api/schools');document.querySelector('#login').hidden=true;document.querySelector('#dashboard').hidden=false;document.querySelector('#status').textContent=(await request('/api/status')).driveConnected?'✅ Drive conectado':'⚠️ Drive ainda não conectado';render()}function render(){const f=document.querySelector('#filter').value;document.querySelector('#schools').innerHTML=schools.filter(s=>!f||s.representative===f).map(s=>`<article><strong>${s.name.replaceAll('<','&lt;')} (${s.year})</strong> — ${s.representative} — ${s.received} envio(s)<div><input readonly value="${s.link}"><button type="button" onclick="navigator.clipboard.writeText('${s.link}')">Copiar link</button><button type="button" onclick="show(${s.id})">Ver envios</button></div><div id="sub${s.id}"></div></article>`).join('')}async function show(id){const rows=await request('/api/submissions/'+id);document.querySelector('#sub'+id).textContent=rows.map(r=>`${r.student} (${r.class_name||'sem turma'}) — ${r.submitted_at}`).join(' | ')||'Nenhum envio'}document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();try{await request('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await load()}catch(err){msg.textContent=err.message}};document.querySelector('#add').onsubmit=async e=>{e.preventDefault();try{await request('/api/schools',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await load();msg.textContent='Escola cadastrada'}catch(err){msg.textContent=err.message}};document.querySelector('#filter').onchange=render;document.querySelector('#logout').onclick=async()=>{await request('/api/logout',{method:'POST'});location.reload()};load().catch(()=>{});</script></html>
