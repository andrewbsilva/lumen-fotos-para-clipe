<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumen Fotos para Clipe</title><link rel="stylesheet" href="/style.css"><main class="card"><header><h1>🎓 LUMEN FOTOS</h1><h2>PARA CLIPE</h2></header><h3 id="school">Carregando escola...</h3><p>Sua foto, nossa história! Envie sua melhor foto para o clipe da sua formatura.</p><form id="f"><label>Seu nome completo<input name="student" required minlength="3" maxlength="120" placeholder="Digite seu nome"></label><label>Turma (opcional)<input name="className" maxlength="60" placeholder="Ex.: 9º A"></label><label class="file">📸 Escolher uma foto da galeria<input type="file" name="photo" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" required></label><small>Uma foto por envio, até 10 MB. A foto será ajustada para facilitar a edição do clipe.</small><label class="check"><input type="checkbox" name="authorization" value="yes" required> Confirmo que possuo a autorização necessária para enviar esta imagem e utilizá-la no clipe da formatura. Para menores, o responsável deve autorizar.</label><button>ENVIAR MINHA FOTO</button><p id="msg" role="status"></p></form></main><script>const token=location.pathname.split('/').pop();fetch('/api/school/'+token).then(r=>r.json()).then(s=>document.querySelector('#school').textContent=s.name+' — '+s.year).catch(()=>document.querySelector('#school').textContent='Link indisponível');document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector('button'),m=document.querySelector('#msg');b.disabled=true;m.textContent='Enviando sua foto...';try{const data=new FormData(f);if(data.get('photo').size>10*1024*1024)throw Error('Escolha uma foto de até 10 MB');const r=await fetch('/api/upload/'+token,{method:'POST',body:data});const j=await r.json();if(!r.ok)throw Error(j.error||'Erro no envio');m.textContent='✅ Foto enviada com sucesso!';f.reset();}catch(err){m.textContent='⚠️ '+err.message}finally{b.disabled=false}};</script></html>
